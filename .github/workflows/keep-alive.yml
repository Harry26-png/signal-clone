# Render's free tier sleeps a service after ~15 minutes without traffic; a cold start takes 30-60s.
# Pinging the health endpoint every few minutes keeps the demo API warm for reviewers.
name: Keep API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 https://signal-clone-api-0ibc.onrender.com/health
