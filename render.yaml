# Render Blueprint for the FastAPI backend (frontend deploys to Vercel).
# Must run as a single instance with one worker: WebSocket connections live in process memory.
services:
  - type: web
    name: signal-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: SEED_ON_STARTUP
        value: "true"
